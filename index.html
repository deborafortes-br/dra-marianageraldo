<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dra. Mariana Geraldo — Obstetrícia &amp; Medicina Fetal</title>
<meta name="description" content="Pré-natal de risco habitual e alto risco, ultrassonografia obstétrica e parto humanizado com a Dra. Mariana Geraldo, especialista em Medicina Fetal pela USP.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%232B1F2E'/%3E%3Cpath d='M15,50 L35,50 L42,30 L50,70 L58,35 L65,50 L85,50' fill='none' stroke='%23C68A4E' stroke-width='6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F7EFE9;
    --bg-card: #FFFCFA;
    --ink: #3A1A28;
    --ink-soft: #6B4B57;
    --brand-2: #852D4B;
    --brand-gradient: linear-gradient(to right, #3A1A28, #852D4B);
    --amber: #C68A4E;
    --amber-deep: #A8702F;
    --whatsapp-green: #25D366;
    --sage: #7C8F6E;
    --rose: #D8ADA3;
    --line: #E4D2D8;

    --font-display: 'Fraunces', serif;
    --font-body: 'Manrope', sans-serif;
    --font-mono: 'Space Mono', monospace;

    --max: 1160px;
    --radius: 22px;
  }

  *{ box-sizing: border-box; }
  html{ scroll-behavior: smooth; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  img,svg{ display:block; max-width:100%; }
  a{ color: inherit; }
  ::selection{ background: var(--rose); color: var(--ink); }

  :focus-visible{
    outline: 2.5px solid var(--amber-deep);
    outline-offset: 3px;
    border-radius: 4px;
  }

  .wrap{
    max-width: var(--max);
    margin: 0 auto;
    padding: 0 28px;
  }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 0.72rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--amber-deep);
    font-weight: 700;
    display:inline-flex;
    align-items:center;
    gap:10px;
  }
  .eyebrow::before{
    content:"";
    width: 22px;
    height: 1.5px;
    background: var(--amber-deep);
    display:inline-block;
  }

  h1,h2,h3{
    font-family: var(--font-display);
    color: var(--ink);
    margin: 0;
    letter-spacing: -0.01em;
  }

  .btn{
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.95rem;
    letter-spacing: 0.01em;
    padding: 15px 28px;
    border-radius: 100px;
    border: 1.5px solid transparent;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    text-decoration: none;
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
    white-space: nowrap;
  }
  .btn-primary{
    background: var(--brand-2);
    color: #FFFFFF;
    box-shadow: 0 8px 22px -8px rgba(133,45,75,0.4);
  }
  .btn-primary:hover{ background: var(--ink); transform: translateY(-2px); box-shadow: 0 12px 26px -8px rgba(58,26,40,0.5); }
  .btn-ghost{
    background: transparent;
    color: var(--ink);
    border-color: var(--ink);
  }
  .btn-ghost:hover{ background: var(--ink); color: var(--bg); transform: translateY(-2px); }

  .wp-icon {
    width: 18px;
    height: 18px;
    fill: var(--whatsapp-green);
  }

  /* ---------- HEADER ---------- */
  header{
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(247,239,233,0.7);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid transparent;
    transition: border-color .3s ease, background .3s ease;
  }
  header.is-scrolled{
    border-bottom-color: var(--line);
    background: rgba(247,239,233,0.92);
  }
  .nav{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 16px 0;
  }
  .brand{
    display:flex;
    align-items:center;
    gap: 12px;
    text-decoration:none;
  }
  .brand-logo{
    height: 64px;
    width: auto;
    display:block;
  }
  .nav-links{
    display:flex;
    align-items:center;
    gap: 34px;
    list-style:none;
    margin:0; padding:0;
  }
  .nav-links a{
    text-decoration:none;
    font-weight:600;
    font-size: 0.92rem;
    color: var(--ink-soft);
    position:relative;
    padding-bottom:3px;
  }
  .nav-links a:hover{ color: var(--ink); }
  .nav-cta{ display:flex; align-items:center; gap:16px; }
  .burger{
    display:none;
    background:none; border:none; cursor:pointer;
    width:40px; height:40px; padding:0;
    flex-direction:column; align-items:center; justify-content:center; gap:5px;
  }
  .burger span{ width:22px; height:2px; background:var(--ink); border-radius:2px; transition: all .25s ease; }
  .mobile-panel{
    display:none;
    flex-direction:column;
    gap: 18px;
    padding: 20px;
    background: var(--bg-card);
    border-bottom: 1px solid var(--line);
  }
  .mobile-panel.open{ display:flex; }
  .mobile-panel a{ text-decoration:none; color:var(--ink); font-weight:600; font-size:1.05rem; }

  @media (max-width: 880px){
    .nav-links{ display:none; }
    .nav-cta .btn-ghost{ display:none; }
    .burger{ display:flex; }
  }

  /* ---------- HERO ---------- */
  .hero{
    padding: 76px 0 40px;
    position:relative;
    overflow:hidden;
  }
  .hero-grid{
    display:grid;
    grid-template-columns: 1.1fr 0.9fr;
    gap: 56px;
    align-items:center;
  }
  .hero h1{
    font-size: clamp(2.3rem, 4.1vw + 1rem, 3.7rem);
    font-weight: 600;
    line-height: 1.06;
    margin: 18px 0 22px;
  }
  .hero h1 em{
    font-style: italic;
    font-weight: 500;
    color: var(--brand-2);
  }
  .hero p.lead{
    font-size: 1.08rem;
    color: var(--ink-soft);
    max-width: 46ch;
    margin: 0 0 32px;
  }
  .hero-ctas{ display:flex; gap:16px; flex-wrap:wrap; margin-bottom: 28px;}
  
  .hero-visual{
    position:relative;
    background: var(--brand-gradient);
    border-radius: 32px;
    padding: 44px 34px;
    color: var(--bg);
    min-height: 420px;
    display:flex;
    flex-direction:column;
    justify-content: space-between;
    overflow:hidden;
    box-shadow: 0 20px 40px -15px rgba(58,26,40,0.3);
  }
  .hero-visual::after{
    content:"";
    position:absolute;
    inset:0;
    background: radial-gradient(120% 90% at 85% -10%, rgba(198,138,78,0.25), transparent 60%);
    pointer-events:none;
  }
  .hero-visual .tag{
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--rose);
    border: 1px solid rgba(247,239,233,0.25);
    padding: 7px 12px;
    border-radius: 100px;
    width: fit-content;
    position:relative;
  }

  .hero-visual .followers-title {
    font-family: var(--font-display);
    font-size: clamp(2.5rem, 3.5vw, 3.8rem);
    font-weight: 700;
    line-height: 1.1;
    color: var(--bg);
  }

  .hero-visual .followers-text {
    font-size: 0.95rem;
    line-height: 1.5;
    color: rgba(247,239,233,0.85);
    margin-top: 8px;
  }

  .hero-visual .credentials{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    position:relative;
    border-top: 1px solid rgba(247,239,233,0.2);
    padding-top: 16px;
  }
  .chip{
    font-family: var(--font-mono);
    font-size: 0.68rem;
    letter-spacing: 0.04em;
    background: rgba(247,239,233,0.1);
    border: 1px solid rgba(247,239,233,0.22);
    color: var(--bg);
    padding: 7px 11px;
    border-radius: 100px;
  }

  @media (max-width: 900px){
    .hero-grid{ grid-template-columns: 1fr; }
    .hero-visual{ min-height: 360px; padding: 32px 24px; }
  }

  /* ---------- SECTION SOBRE / STORYTELLING ---------- */
  .sobre-section {
    background: var(--bg-card);
    padding: 90px 0;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
  }
  .sobre-title-block {
    text-align: center;
    margin-bottom: 48px;
  }
  .sobre-title-block h2 {
    font-size: clamp(1.8rem, 3vw, 2.5rem);
    font-weight: 600;
    color: var(--ink);
  }
  .sobre-divider {
    width: 60px;
    height: 3px;
    background: var(--brand-2);
    margin: 16px auto 0;
    border-radius: 10px;
  }
  .story-box {
    max-width: 820px;
    margin: 0 auto;
    background: var(--bg);
    padding: 40px;
    border-radius: 24px;
    border: 1px solid var(--line);
  }
  .story-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  .story-item {
    display: flex;
    align-items: flex-start;
    gap: 14px;
    font-size: 1.05rem;
    line-height: 1.65;
    color: var(--ink);
    margin-bottom: 20px;
  }
  .story-item:last-child {
    margin-bottom: 0;
  }
  .story-bullet {
    color: var(--brand-2);
    font-weight: bold;
    font-size: 1.1rem;
    line-height: 1;
    margin-top: 2px;
  }

  /* ---------- SECTION AGENDAMENTO ---------- */
  .agenda-section {
    padding: 90px 0;
    text-align: center;
  }
  .agenda-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
    margin: 48px 0;
  }
  .agenda-card {
    background: var(--bg-card);
    padding: 36px 28px;
    border-radius: var(--radius);
    border: 1px solid var(--line);
    box-shadow: 0 10px 20px -10px rgba(58,26,40,0.05);
    text-align: center;
  }
  .agenda-num {
    width: 44px;
    height: 44px;
    background: rgba(58,26,40,0.05);
    color: var(--ink);
    border-radius: 50%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    margin-bottom: 18px;
  }
  .agenda-card h3 {
    font-size: 1.25rem;
    font-weight: 600;
    margin-bottom: 10px;
  }
  .agenda-card p {font-size: 0.92rem;color: var(--ink-soft);}@media (max-width: 820px) {.agenda-grid { grid-template-columns: 1fr; gap: 20px; }.story-box { padding: 24px; }}/* ---------- FOOTER ---------- */footer {background: var(--ink);color: rgba(247,239,233,0.7);padding: 48px 0;font-size: 0.85rem;}.footer-flex {display: flex;justify-content: space-between;align-items: center;flex-wrap: wrap;gap: 24px;}Dra. Mariana Geraldo • Obstetrícia & Medicina FetalCRM/SP: XXXXX • RQE: XXXXX© 2026 Dra. Mariana Geraldo • Todos os direitos reservados.window.addEventListener('scroll', () => {const header = document.querySelector('header');if (window.scrollY > 50) {header.classList.add('is-scrolled');} else {header.classList.remove('is-scrolled');}});const burger = document.querySelector('.burger');const mobilePanel = document.querySelector('.mobile-panel');burger.addEventListener('click', () => {mobilePanel.classList.toggle('open');});
